name: video-interview-smoke

on:
  pull_request:
    paths:
      - "video_interview_mvp/**"
      - ".github/workflows/video-interview-smoke.yml"
  push:
    branches: [main]
    paths:
      - "video_interview_mvp/**"

jobs:
  smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: video_interview_mvp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m compileall -q .
      - run: python -m unittest discover -s tests -v
