name: video-interview-smoke

on:
  pull_request:
    paths:
      - "video_interview_mvp/**"
      - ".github/workflows/video-interview-smoke.yml"
  push:
    branches: [main]
    paths:
      - "video_interview_mvp/**"

jobs:
  smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: video_interview_mvp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m compileall -q .
      - name: Check canonical app startup
        run: |
          python - <<'PY'
          import main
          paths = {route.path for route in main.app.routes}
          assert "/api/auth/login" in paths
          assert "/api/auth/bootstrap-status" in paths
          assert "/dashboard" in paths
          legacy = main._legacy_app
          pairs = [(route.path, route.methods or set()) for route in legacy.routes if hasattr(route, "path")]
          assert sum(path == "/api/questions" and "GET" in methods for path, methods in pairs) == 1
          assert sum(path == "/api/interviews/{session_id}/complete" and "POST" in methods for path, methods in pairs) == 1
          assert sum(path == "/api/reports/{session_id}" and "GET" in methods for path, methods in pairs) == 1
          print("main:app + canonical business routes OK")
          PY
      - run: python -m unittest discover -s tests -v
      - name: Check browser scripts syntax
        run: |
          node --check static/proctor.js
          node --check static/session_bridge.js
          node --check static/mediapipe_proctor.js
          node --check static/question_bank_ui.js
          node --check static/scoring_report_ui.js
