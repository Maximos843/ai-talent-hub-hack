<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход - AI Interview</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .auth-bg {
            background: linear-gradient(135deg, #4F46E5 0%, #06B6D4 100%);
            position: relative;
            overflow: hidden;
        }
        .auth-bg::before {
            content: '';
            position: absolute;
            width: 600px;
            height: 600px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            top: -200px;
            right: -200px;
        }
        .auth-bg::after {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 50%;
            bottom: -100px;
            left: -100px;
        }
    </style>
</head>
<body class="auth-bg min-h-screen flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden">
        <div class="p-8">
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-16 h-16 bg-indigo-100 rounded-2xl mb-4">
                    <svg class="w-8 h-8 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
                    </svg>
                </div>
                <h1 class="text-2xl font-bold text-gray-900">AI Interview</h1>
                <p class="text-gray-500 mt-2">Платформа умного найма</p>
            </div>
            
            <!-- Форма входа -->
            <form id="loginForm">
                <div class="space-y-5">
                    <div>
                        <label for="loginUsername" class="block text-sm font-medium text-gray-700 mb-2">Имя пользователя</label>
                        <input type="text" id="loginUsername" required 
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition"
                            placeholder="Введите имя пользователя">
                    </div>
                    <div>
                        <label for="loginPassword" class="block text-sm font-medium text-gray-700 mb-2">Пароль</label>
                        <input type="password" id="loginPassword" required 
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition"
                            placeholder="••••••••">
                    </div>
                </div>
                
                <button type="submit" 
                    class="w-full mt-6 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-lg transition duration-200 shadow-lg shadow-indigo-200">
                    Войти в систему
                </button>
                
                <p class="text-red-500 text-sm text-center mt-4" id="loginError"></p>
                
                <div class="text-center mt-6 pt-6 border-t border-gray-100">
                    <p class="text-gray-600">
                        Нет аккаунта? 
                        <a href="#" onclick="showRegister()" class="text-indigo-600 hover:text-indigo-700 font-medium">Зарегистрироваться</a>
                    </p>
                </div>
            </form>
            
            <!-- Форма регистрации -->
            <form id="registerForm" class="hidden">
                <div class="space-y-4">
                    <div>
                        <label for="regUsername" class="block text-sm font-medium text-gray-700 mb-2">Имя пользователя</label>
                        <input type="text" id="regUsername" required 
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition"
                            placeholder="Придумайте логин">
                    </div>
                    <div>
                        <label for="regPassword" class="block text-sm font-medium text-gray-700 mb-2">Пароль</label>
                        <input type="password" id="regPassword" required 
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition"
                            placeholder="Минимум 6 символов" minlength="6">
                    </div>
                    <div>
                        <label for="regFullName" class="block text-sm font-medium text-gray-700 mb-2">ФИО</label>
                        <input type="text" id="regFullName" 
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition"
                            placeholder="Иванов Иван Иванович">
                    </div>
                    <div>
                        <label for="regRole" class="block text-sm font-medium text-gray-700 mb-2">Роль</label>
                        <select id="regRole" required 
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition bg-white">
                            <option value="hr">HR / Рекрутер</option>
                            <option value="hiring_manager">Нанимающий менеджер</option>
                        </select>
                    </div>
                    <div class="bg-indigo-50 border border-indigo-200 rounded-lg p-4">
                        <label class="block text-sm font-medium text-indigo-900 mb-2">Пригласительный код</label>
                        <input type="text" id="regInviteCode" required 
                            class="w-full px-4 py-3 border border-indigo-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition bg-white"
                            placeholder="Введите код от HR">
                        <p class="text-xs text-indigo-600 mt-2">
                            💡 Для HR: <code class="bg-indigo-100 px-2 py-1 rounded">hr_master_key_2024</code><br>
                            💡 Для менеджера: <code class="bg-indigo-100 px-2 py-1 rounded">manager_master_key_2024</code>
                        </p>
                    </div>
                </div>
                
                <button type="submit" 
                    class="w-full mt-6 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-lg transition duration-200 shadow-lg shadow-indigo-200">
                    Создать аккаунт
                </button>
                
                <p class="text-red-500 text-sm text-center mt-4" id="registerError"></p>
                
                <div class="text-center mt-6 pt-6 border-t border-gray-100">
                    <p class="text-gray-600">
                        Уже есть аккаунт? 
                        <a href="#" onclick="showLogin()" class="text-indigo-600 hover:text-indigo-700 font-medium">Войти</a>
                    </p>
                </div>
            </form>
        </div>
        
        <div class="bg-gray-50 px-8 py-4 border-t border-gray-100">
            <p class="text-xs text-gray-500 text-center">
                🔒 Безопасная авторизация с использованием токенов доступа
            </p>
        </div>
    </div>

    <script>
        function showRegister() {
            document.getElementById('loginForm').classList.add('hidden');
            document.getElementById('registerForm').classList.remove('hidden');
        }
        
        function showLogin() {
            document.getElementById('registerForm').classList.add('hidden');
            document.getElementById('loginForm').classList.remove('hidden');
        }
        
        // Вход
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('loginUsername').value;
            const password = document.getElementById('loginPassword').value;
            
            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Authorization': 'Basic ' + btoa(username + ':' + password),
                        'Content-Type': 'application/json'
                    }
                });
                
                if (response.ok) {
                    const data = await response.json();
                    localStorage.setItem('user', JSON.stringify(data));
                    localStorage.setItem('auth', btoa(username + ':' + password));
                    window.location.href = '/dashboard';
                } else {
                    const errData = await response.json();
                    document.getElementById('loginError').textContent = errData.detail || 'Неверные учетные данные';
                }
            } catch (err) {
                document.getElementById('loginError').textContent = 'Ошибка подключения к серверу';
            }
        });
        
        // Регистрация
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('regUsername').value;
            const password = document.getElementById('regPassword').value;
            const fullName = document.getElementById('regFullName').value;
            const role = document.getElementById('regRole').value;
            const inviteCode = document.getElementById('regInviteCode').value;
            
            try {
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password, full_name: fullName, role, invite_code: inviteCode })
                });
                
                if (response.ok) {
                    alert('✅ Аккаунт успешно создан! Теперь войдите.');
                    showLogin();
                } else {
                    const data = await response.json();
                    document.getElementById('registerError').textContent = data.detail || 'Ошибка регистрации';
                }
            } catch (err) {
                document.getElementById('registerError').textContent = 'Ошибка подключения к серверу';
            }
        });
    </script>
</body>
</html>
