version: '3.8'

services:
  video-interview-mvp:
    build: .
    container_name: video_interview_service
    ports:
      - "8000:8000"
    volumes:
      - ./video_interview.db:/app/video_interview.db
      - ./uploads:/app/uploads
      - ./data:/app/data
    environment:
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_BASE_URL=https://openrouter.ai/api/v1
      - LLM_MODEL=qwen/qwen-2.5-72b-instruct
      - DEEPGRAM_API_KEY=${DEEPGRAM_API_KEY:-}
      - TTS_VOICE=ru-RU-DmitryNeural
      - TTS_RATE=+0%
      - TTS_VOLUME=+0%
      - TLS_HOST=${TLS_HOST:-localhost}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-k", "-f", "https://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
